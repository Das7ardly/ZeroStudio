name: Attach downloads to release
# Copies the exe files from the downloads branch into the Assets of a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.9.0
  push:
    branches: [main]
    paths: [.github/workflows/attach-release.yml]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: downloads
      - run: gh release upload "$TAG" *.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.9.0' }}
